# Render 免费部署（无需买服务器；Render 能直连 Aiven MySQL）
# 用法：把仓库推到 GitHub → Render → New → Blueprint → 选本仓库 → 自动读这个文件
services:
  - type: web
    name: luoyunzong-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_TOKEN
        sync: false # 在 Render 面板里填（与 App 内置令牌一致）
      - key: ORG_ID
        value: default
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '23483'
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: 'true'
      - key: STORAGE_DRIVER
        value: local # 视频多了再换 upyun / s3
      - key: UPYUN_BUCKET
        value: my-media
      - key: UPYUN_OPERATOR
        value: mymedia
      - key: UPYUN_PASSWORD
        sync: false
      - key: UPYUN_DOMAIN
        sync: false
