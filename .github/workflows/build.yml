name: Build (All Platforms)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_release:
        description: '把本次构建产物发布为 Release'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'

jobs:
  # ------------------------------------------------------------------
  # 1) 桌面端：Windows / macOS / Linux —— 每个平台一个「单文件便携版」
  #    Windows: luoyunzong-portable.exe   Linux: luoyunzong-portable.run
  #    macOS:   luoyunzong-macos.dmg
  # ------------------------------------------------------------------
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: luoyunzong-windows-portable
            file: dist/luoyunzong-portable.exe
          - os: macos-latest
            target: macos
            artifact: luoyunzong-macos-dmg
            file: dist/luoyunzong-macos.dmg
          - os: ubuntu-latest
            target: linux
            artifact: luoyunzong-linux-portable
            file: dist/luoyunzong-portable.run
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev pkg-config clang cmake \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev mpv libmpv-dev

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Make portable single-file (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: pwsh -File tool/windows_portable.ps1

      - name: Make portable single-file (Linux)
        if: matrix.target == 'linux'
        run: bash tool/linux_portable.sh

      - name: Make portable single-file (macOS)
        if: matrix.target == 'macos'
        run: bash tool/macos_portable.sh

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) 手机端：Android 单文件 APK、iOS 单文件未签名 IPA
  # ------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK (single file, all ABIs)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk luoyunzong.apk
          ls -lh luoyunzong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: luoyunzong-android-apk
          path: luoyunzong.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa (single file)
        run: |
          rm -rf Payload luoyunzong-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry luoyunzong-unsigned.ipa Payload
          rm -rf Payload
          ls -lh luoyunzong-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: luoyunzong-ios-ipa
          path: luoyunzong-unsigned.ipa
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) 网页版：单文件 HTML（16MB 左右，双击即用，可离线；另可托管）
  # ------------------------------------------------------------------
  web:
    name: Web single-file html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web (bundled CanvasKit, no CDN)
        run: flutter build web --release --no-web-resources-cdn

      - name: Inline everything into one html
        run: dart run tool/inline_web.dart build/web dist/luoyunzong.html

      - name: Verify single-file html
        run: |
          test -f dist/luoyunzong.html
          grep -q "LYZ_RESOURCES" dist/luoyunzong.html
          node -e "const s=require('fs').statSync('dist/luoyunzong.html').size; if(s<5*1024*1024){console.error('html 过小，可能未内联成功');process.exit(1)} console.log('html size MB:', (s/1048576).toFixed(1))"

      - uses: actions/upload-artifact@v4
        with:
          name: luoyunzong-web-html
          path: dist/luoyunzong.html
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 4) 打 tag 时汇总发布（只有单文件产物）
  # ------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [desktop, android, ios, web]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect single-file artifacts
        run: |
          mkdir -p release
          find dist -maxdepth 3 -type f \( -name '*.exe' -o -name '*.run' -o -name '*.dmg' \
            -o -name '*.apk' -o -name '*.ipa' -o -name '*.html' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
