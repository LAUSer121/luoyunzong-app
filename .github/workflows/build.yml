name: Build (All Platforms)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_release:
        description: '把本次构建产物发布为 Release（仅在 tag 触发时自动执行）'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'

jobs:
  # ------------------------------------------------------------------
  # 1) 桌面端：Windows / macOS / Linux
  # ------------------------------------------------------------------
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: luoyunzong-windows
            path: build/windows/x64/runner/Release/
          - os: macos-latest
            target: macos
            artifact: luoyunzong-macos
            path: build/macos/Build/Products/Release/*.app
          - os: ubuntu-latest
            target: linux
            artifact: luoyunzong-linux
            path: build/linux/x64/release/bundle/
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev pkg-config clang cmake mpv libmpv-dev

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Pack Linux bundle
        if: matrix.target == 'linux'
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}.tar.gz" bundle
          ls -lh "$GITHUB_WORKSPACE/${{ matrix.artifact }}.tar.gz"

      - name: Pack macOS app
        if: matrix.target == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -qry "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" *.app
          ls -lh "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip"

      - name: Upload artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - name: Upload artifact (Linux / macOS archive)
        if: matrix.target != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) 移动端：Android APK / AAB、iOS 未签名包
  # ------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "luoyunzong-${f#app-}"; done
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: luoyunzong-android
          path: |
            build/app/outputs/flutter-apk/luoyunzong-*.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign

      - name: Package .app
        run: |
          cd build/ios/iphoneos
          zip -qry "$GITHUB_WORKSPACE/luoyunzong-ios-unsigned.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: luoyunzong-ios-unsigned
          path: luoyunzong-ios-unsigned.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Web：可静态托管（手机浏览器 / 电脑浏览器直接使用）
  # ------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --source-maps

      - uses: actions/upload-artifact@v4
        with:
          name: luoyunzong-web
          path: build/web/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 4) 打 tag 时汇总发布
  # ------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [desktop, android, ios, web]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
