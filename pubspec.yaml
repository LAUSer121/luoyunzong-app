name: luoyunzong
description: "落云宗 · 宗门管理：Flutter 多端单文件版（Windows/macOS/Linux/Android/iOS/单文件 HTML）"
publish_to: 'none'

# 版本号：语义化版本 + 构建号（Android versionName/versionCode、iOS/macOS CFBundle*、Windows 文件版本）
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  archive: ^4.3.0
  audioplayers: ^6.8.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  image: ^4.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# 应用图标：由 tool/make_icon.dart 生成 assets/icon/icon.png，
# 再用 `dart run flutter_launcher_icons` 派生到各平台。
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#070D1C"
    theme_color: "#F7E2A8"
